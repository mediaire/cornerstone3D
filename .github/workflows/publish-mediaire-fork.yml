name: Publish Mediaire Packages

on:
  push:
    branches:
      - main

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  id-token: write # Required for OIDC (npm trusted publishing)

jobs:
  publish:
    name: Publish to Mediaire GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.7.0
          registry-url: "https://npm.pkg.github.com"
          scope: "@mediaire"

      # authenticate npm to GitHub Packages
      - name: Configure npm auth
        run: |
          echo "@mediaire:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" > ~/.npmrc

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev pkg-config

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: bun run build

      - name: Publish packages
        env:
          HUSKY_SKIP_INSTALL: true
        run: bun run lerna publish from-package --no-verify-access --ignore-scripts --yes --registry https://registry.npmjs.org

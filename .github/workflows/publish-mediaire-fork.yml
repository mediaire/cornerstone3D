name: Publish Mediaire Packages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # Required for OIDC (npm trusted publishing)

jobs:
  publish:
    name: Publish to Mediaire GitHub Packages
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_PROVENANCE: true

    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0 # we need npm 11.5.1+ for trusted publishing
          check-latest: true


      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev pkg-config

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: bun run build

      - name: Publish packages
        env:
          HUSKY_SKIP_INSTALL: true
        run: npx lerna publish from-package --yes --ignore-scripts
